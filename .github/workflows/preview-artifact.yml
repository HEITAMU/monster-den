name: Cocos source-runtime preview build and sync

on:
  push:
    branches: [work/first-room-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact project dependencies
        run: npm install --ignore-scripts
      - name: Verify game rules and save contracts
        run: npm test
      - name: Build official Cocos source-runtime preview
        run: npm run build:web
      - name: Commit compiled web files back to the preview branch
        if: github.ref == 'refs/heads/work/first-room-rebuild'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/
          if git diff --cached --quiet; then
            echo 'Compiled preview already matches source.'
          else
            git commit -m 'build: synchronize generated Cocos preview from 0.4 source'
            git push origin HEAD:work/first-room-rebuild
          fi
      - name: Preserve actual compiled preview
        uses: actions/upload-artifact@v4
        with:
          name: monster-den-v040-compiled
          path: web/
          retention-days: 7
          include-hidden-files: true
