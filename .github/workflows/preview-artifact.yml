name: Cocos web preview build artifact

on:
  push:
    branches: [work/first-room-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact project dependencies
        run: npm install --ignore-scripts
      - name: Verify game rules and save contracts
        run: npm test
      - name: Build official Cocos source-runtime preview
        run: npm run build:web
      - name: Preserve actual compiled preview
        uses: actions/upload-artifact@v4
        with:
          name: monster-den-v040-compiled
          path: web/
          retention-days: 7
          include-hidden-files: true
