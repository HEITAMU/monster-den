name: Cocos WebGL playable acceptance

on:
  push:
    branches: [main, work/window2-playable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned project tools
        run: npm install --ignore-scripts
      - name: Install browser and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify game and platform contracts
        run: npm test
      - name: Build shared Creator scripts for the real engine preview
        run: npm run build:web
      - name: Run full WebGL game and touch acceptance
        env:
          COCOS_SOFTWARE_GL: '1'
        run: npm run check:web
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-den-webgl-${{ github.sha }}
          path: .build/game-browser/
          retention-days: 14
          include-hidden-files: true
